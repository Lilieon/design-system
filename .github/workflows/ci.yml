name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens && pnpm build:registry
      - run: pnpm test
      - run: pnpm build:playground
      - run: pnpm build:storybook

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens && pnpm build:registry
      - run: pnpm build:storybook
      - name: Assemble site
        run: |
          mkdir -p dist/site/registry
          cp -r dist/storybook/* dist/site/
          cp dist/registry/*.json dist/site/registry/
          cp dist/tokens.css dist/tailwind-theme.css dist/site/
          cp llms.txt dist/site/
          cp DESIGN.md dist/site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
