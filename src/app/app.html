<div class="mx-auto flex max-w-5xl flex-col gap-10 px-6 py-12">
  <header class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight">Design System</h1>
      <nav class="mt-2 flex gap-4 text-sm">
        <a
          routerLink="/"
          routerLinkActive="text-foreground font-medium"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-muted-foreground transition-colors hover:text-foreground"
        >
          Gallery
        </a>
        <a
          routerLink="/brand-lab"
          routerLinkActive="text-foreground font-medium"
          class="text-muted-foreground transition-colors hover:text-foreground"
        >
          Brand Lab
        </a>
      </nav>
    </div>
    <button dsButton variant="outline" (click)="toggleDark()">
      {{ dark() ? 'Light' : 'Dark' }}
    </button>
  </header>

  <router-outlet />
</div>
